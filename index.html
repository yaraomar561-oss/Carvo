* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
  background: #E4E4E4;
  padding: 12px;
  display: flex;
}
.card {
  flex: 1;
  background: #FFFFFF;
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 24px;
  position: relative;
  animation: rise .45s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.logo { width: 132px; height: auto; margin-bottom: 28px; }
.badge {
  display: inline-block;
  background: #EAF2FE;
  color: #2F80ED;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 999px;
  margin-bottom: 16px;
}
h1 {
  font-size: 24px;
  font-weight: 800;
  color: #0B0B0B;
  line-height: 1.5;
}
.bar {
  margin-top: 32px;
  width: 160px;
  height: 4px;
  border-radius: 99px;
  background: rgba(11,11,11,.08);
  overflow: hidden;
  position: relative;
}
.bar::after {
  content: '';
  position: absolute;
  top: 0; right: -40%;
  width: 40%;
  height: 100%;
  border-radius: 99px;
  background: #0B0B0B;
  animation: sweep 1.1s ease-in-out infinite;
}
@keyframes sweep { to { right: 100%; } }
.btns { display: none; flex-direction: column; gap: 12px; margin-top: 32px; width: 100%; max-width: 300px; }
.btns a {
  display: block;
  padding: 15px 0;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  color: #fff;
  background: #0B0B0B;
}
.btns a.alt { background: #fff; color: #0B0B0B; border: 1.5px solid #0B0B0B; }
.manual {
  position: absolute;
  bottom: 24px;
  right: 0; left: 0;
  font-size: 13px;
  color: #9A9A9A;
}
.manual a { color: #0B0B0B; text-decoration: none; border-bottom: 1px solid #CFCFCF; padding-bottom: 1px; }
