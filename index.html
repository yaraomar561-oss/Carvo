<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carvo - جارٍ التحويل</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo { font-size: 2.5rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
    .dot { color: #e63946; }
    p { color: #aaa; font-size: 1rem; }
    .spinner {
      margin: 30px auto;
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top: 3px solid #e63946;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback { margin-top: 20px; font-size: 0.85rem; color: #666; }
    .fallback a { color: #e63946; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo">CARVO<span class="dot">.</span></div>
  <p>جارٍ تحويلك لتحميل التطبيق...</p>
  <div class="spinner"></div>
  <div class="fallback">مش بتتحول؟ <a id="manual-link" href="#">اضغط هنا</a></div>

  <script>
    var ios     = "https://apps.apple.com/eg/app/carvo/id6757989520";
    var android = "https://play.google.com/store/apps/details?id=app.carvo.customer";
    var fallback = "https://carvo-comingsoon.lovable.app";

    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var dest = fallback;

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      dest = ios;
    } else if (/android/i.test(ua)) {
      dest = android;
    }

    document.getElementById("manual-link").href = dest;
    setTimeout(function() { window.location.href = dest; }, 1500);
  </script>
</body>
</html>
